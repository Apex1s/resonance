[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance"
version = "1.0.0"
description = "Hybrid audio-feature recommendation engine for Spotify tracks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Anas Sabbahi" },
    { name = "Ammar Haddad" },
    { name = "Othmane Tahfi" },
]
keywords = ["recommender-system", "machine-learning", "spotify", "fastapi", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26", "ruff>=0.4"]
notebook = ["jupyter", "matplotlib", "seaborn", "plotly"]

[project.scripts]
resonance-train = "resonance.train:main"
resonance-snapshot = "resonance.export_snapshot:main"

[project.urls]
Repository = "https://github.com/Apex1s/resonance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resonance = ["api/static/*", "model_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
