name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  pipeline:
    name: end-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Train (fast path)
        run: python -m resonance.train --fast

      - name: Rebuild dashboard snapshot
        run: python -m resonance.export_snapshot

      - name: Check the model still clears the quality bar
        run: |
          python - <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path("reports/metrics.json").read_text())
          auc = m["test_metrics"]["roc_auc"]
          acc = m["test_metrics"]["accuracy"]
          print(f"held-out ROC-AUC={auc:.4f} accuracy={acc:.4f}")
          if auc < 0.80:
              sys.exit(f"regression: ROC-AUC {auc:.4f} is below the 0.80 floor")
          PY

      - name: Boot the API and hit it
        run: |
          uvicorn resonance.api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          SEED=$(curl -sf "localhost:8000/api/tracks?limit=1" | python -c "import json,sys; print(json.load(sys.stdin)[0]['track_id'])")
          curl -sf -X POST localhost:8000/api/recommend \
            -H 'Content-Type: application/json' \
            -d "{\"seed_ids\":[\"$SEED\"],\"k\":5}" | python -c "import json,sys; assert len(json.load(sys.stdin)['results'])==5; print('recommend ok')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metrics
          path: reports/metrics.json
