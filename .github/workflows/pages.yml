name: Deploy dashboard

# The dashboard runs without a backend: it falls back to the bundled snapshot
# and reproduces the ranking in the browser. That makes GitHub Pages a valid
# host for a live demo. Enable Pages (Settings → Pages → Source: GitHub Actions)
# and every push to main refreshes it.

on:
  push:
    branches: [main]
    paths:
      - "src/resonance/api/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the snapshot is present
        run: test -s src/resonance/api/static/snapshot.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: src/resonance/api/static

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
