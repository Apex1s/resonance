name: Deploy dashboard

# The dashboard runs without a backend: it falls back to the bundled snapshot
# and reproduces the ranking in the browser. That makes GitHub Pages a valid
# host for a live demo. Enable Pages (Settings → Pages → Source: GitHub Actions)
# and every push to main refreshes it.

on:
  push:
    branches: [main]
    paths:
      - "src/resonance/api/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the snapshot is present
        run: test -s src/resonance/api/static/snapshot.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: src/resonance/api/static

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
